<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepycatz</title>
    
    <!-- Modern Bold Typography: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- tsParticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-bundle@2.12.0/tsparticles.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                    },
                    colors: {
                        black: '#0a0a0a',
                        white: '#ffffff',
                    }
                }
            }
        }
    </script>

    <style>
        /* Animated Fluid Background */
        .animated-bg {
            background: linear-gradient(-45deg, #050505, #1a1a1a, #2a2a2a, #0a0a0a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            background-attachment: fixed;
            perspective: 1000px; /* For 3D Tilt Effect */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Smooth Entrance Animation */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-slide-up {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
        .stagger-6 { animation-delay: 0.6s; }

        /* Walking Cat Animations */
        @keyframes catWalkAcross {
            0% { left: -100px; transform: scaleX(1); }
            48% { left: calc(100vw + 50px); transform: scaleX(1); }
            50% { left: calc(100vw + 50px); transform: scaleX(-1); }
            98% { left: -100px; transform: scaleX(-1); }
            100% { left: -100px; transform: scaleX(1); }
        }

        @keyframes catStep {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(-4deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-5px) rotate(4deg); }
        }

        @keyframes catTailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
        }

        /* Kitten & Yarn Animations */
        @keyframes kittenChase {
            0%, 100% { transform: translateX(0) scaleX(1); }
            20% { transform: translateX(30px) scaleX(1); }
            30% { transform: translateX(30px) scaleX(-1); }
            50% { transform: translateX(-20px) scaleX(-1); }
            60% { transform: translateX(-20px) scaleX(1); }
        }

        @keyframes rollYarn {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(35px) rotate(180deg); }
            30% { transform: translateX(35px) rotate(180deg); }
            50% { transform: translateX(-25px) rotate(-180deg); }
            60% { transform: translateX(-25px) rotate(-180deg); }
        }

        /* New Animations for 4 Cats */
        @keyframes catWalkAcrossReverse {
            0% { left: calc(100vw + 50px); transform: scaleX(-1); }
            48% { left: -100px; transform: scaleX(-1); }
            50% { left: -100px; transform: scaleX(1); }
            98% { left: calc(100vw + 50px); transform: scaleX(1); }
            100% { left: calc(100vw + 50px); transform: scaleX(-1); }
        }

        @keyframes catBreathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-2px); }
        }

        .cat-walk-track {
            position: fixed;
            bottom: 12px;
            z-index: 30;
            animation: catWalkAcross 28s linear infinite;
            cursor: pointer;
            user-select: none;
        }

        .cat-body-bounce {
            animation: catStep 0.45s ease-in-out infinite;
        }

        .cat-tail {
            transform-origin: bottom left;
            animation: catTailWag 1s ease-in-out infinite;
        }

        .kitten-track {
            position: fixed;
            bottom: 10px;
            right: 15%;
            z-index: 28;
            cursor: pointer;
        }

        /* Floating effects & particles */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        .floating-element {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Click Sparkles */
        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px white;
            opacity: 0;
        }

        /* Toast Notification */
        .toast {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100px);
            opacity: 0;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>

             <svg class="w-6 h-6 text-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.4)]" viewBox="0 0 100 100" fill="currentColor">
                <circle cx="50" cy="50" r="40" />
                <path d="M 20 40 Q 50 20 80 40 M 15 50 Q 50 40 85 50 M 20 60 Q 50 60 80 60" stroke="#000" stroke-width="2" fill="none" opacity="0.3"/>
                <path d="M 30 20 Q 20 50 40 85 M 50 15 Q 40 50 60 85 M 70 20 Q 60 50 75 80" stroke="#000" stroke-width="2" fill="none" opacity="0.3"/>
             </svg>
        </div>
    </div>

    <!-- 4. Moli (Anak Kucing Oranye Bersantai, Kiri Bawah) -->
    <div class="interactive-cat group" style="position: fixed; bottom: 12px; left: 10%; z-index: 28; cursor: pointer; animation: catBreathe 3s ease-in-out infinite;" title="Klik Moli!">
        <div class="absolute -top-4 left-1/2 -translate-x-1/2 text-[9px] font-bold bg-[#f59e0b]/30 backdrop-blur-md px-2 py-0.5 rounded-full text-[#fef3c7] border border-[#f59e0b]/50 whitespace-nowrap shadow-lg z-40">Moli</div>
        <div class="cat-bubble absolute -top-10 left-1/2 -translate-x-1/2 bg-white text-orange-500 text-[10px] font-extrabold px-2 py-1 rounded-full opacity-0 transition-all duration-300 pointer-events-none shadow-lg whitespace-nowrap z-50">Zzz...</div>
        
        <div class="cat-avatar transition-transform duration-200">
            <!-- Warna Oranye (#f59e0b) -->
            <svg class="w-10 h-10 text-[#f59e0b] drop-shadow-[0_0_5px_rgba(245,158,11,0.4)]" viewBox="0 0 100 100" fill="currentColor" style="transform: scaleX(-1);">
                <!-- Mirror Horizontal so Moli faces right -->
                <path class="cat-tail" style="animation: catTailWag 2s ease-in-out infinite;" d="M 20 60 C 10 50, 15 30, 25 35 C 28 37, 24 42, 22 40 C 15 35, 12 45, 25 55 Z" />
                <ellipse cx="45" cy="65" rx="22" ry="14" />
                <rect x="28" y="70" width="5" height="12" rx="2.5" />
                <rect x="38" y="70" width="5" height="12" rx="2.5" />
                <rect x="52" y="70" width="5" height="12" rx="2.5" />
                <rect x="62" y="70" width="5" height="12" rx="2.5" />
                <circle cx="70" cy="50" r="16" />
                <path d="M 58 40 L 58 20 L 68 35 Z" />
                <path d="M 72 35 L 85 22 L 82 40 Z" />
                <path d="M 60 38 L 60 25 L 66 35 Z" fill="#ffb6c1" />
                <path d="M 74 36 L 81 27 L 79 39 Z" fill="#ffb6c1" />
                <!-- Mata Tidur -->
                <path d="M 62 48 Q 65 45 68 48" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M 74 48 Q 77 45 80 48" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <circle cx="71" cy="52" r="1.5" fill="#ffb6c1" />
                <g stroke="#000" stroke-width="0.75" stroke-linecap="round">
                    <path d="M 58 48 L 52 46 M 58 50 L 50 50 M 58 52 L 52 54" />
                    <path d="M 84 48 L 90 46 M 84 50 L 92 50 M 84 52 L 90 54" />
                </g>
            </svg>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full font-bold text-xs tracking-widest uppercase shadow-[0_0_20px_rgba(255,255,255,0.4)] z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-green-500"></i>
        <span id="toast-msg">Link Copied!</span>
    </div>

    <!-- Hidden input for clipboard copy fallback -->
    <input type="text" id="clipboard-input" value="https://budisantoso.com" class="fixed -top-full -left-full opacity-0 pointer-events-none">

    <script>
        // --- 1. PARTICLES INIT ---
        window.addEventListener('load', function () {
            if (typeof tsParticles !== 'undefined') {
                tsParticles.load("tsparticles", {
                    background: { color: { value: "transparent" } },
                    fpsLimit: 60,
                    interactivity: {
                        events: {
                            onHover: { enable: true, mode: "grab" },
                            onClick: { enable: true, mode: "push" },
                            resize: true,
                        },
                        modes: {
                            grab: { distance: 200, links: { opacity: 0.3 } },
                            push: { quantity: 2 },
                        },
                    },
                    particles: {
                        color: { value: ["#ffffff", "#888888", "#444444"] },
                        links: {
                            color: "#ffffff", distance: 150, enable: true, opacity: 0.1, width: 1,
                        },
                        move: {
                            direction: "none", enable: true, outModes: { default: "bounce" }, random: true, speed: 0.5, straight: false,
                        },
                        number: { density: { enable: true, area: 800 }, value: 60 },
                        opacity: { value: 0.4 },
                        shape: { type: "circle" },
                        size: { value: { min: 1, max: 2.5 } },
                    },
                    detectRetina: true,
                });
            }
        });

        // --- 2. LIVE STATS (Clock & Visitors) ---
        const timeEl = document.getElementById('live-time');
        const visitorEl = document.getElementById('visitor-count');
        let visitors = 1204;

        setInterval(() => {
            const now = new Date();
            // Assuming server/user is in Indonesia, format simple HH:MM
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            timeEl.innerText = `${timeString} WIB`;
            
            // Randomly fluctuate visitors
            if(Math.random() > 0.5) visitors += Math.floor(Math.random() * 3);
            else visitors -= Math.floor(Math.random() * 2);
            visitorEl.innerText = visitors.toLocaleString();
        }, 1000); // update every second for clock, visitors change subtly

        // --- 6. ACTION BUTTONS (Like, Coffee, Share) ---
        let likes = 0;
        const likeBtn = document.getElementById('like-btn');
        const likeCount = document.getElementById('like-count');
        const likeIcon = document.querySelector('#like-btn i');

        likeBtn.addEventListener('click', (e) => {
            likes++;
            likeCount.innerText = likes;
            likeCount.classList.remove('hidden');
            likeIcon.classList.remove('fa-regular', 'text-gray-400');
            likeIcon.classList.add('fa-solid', 'text-white');
            
            // Pop +1 effect
            spawnFloatingElement(e.clientX, e.clientY, '+1', 'text-white font-bold text-sm');
            spawnSparks(e.clientX, e.clientY);
        });

        document.getElementById('coffee-btn').addEventListener('click', (e) => {
            spawnFloatingElement(e.clientX, e.clientY, '☕', 'text-2xl');
            showToast("Redirecting to Coffee...");
        });

        document.getElementById('share-btn').addEventListener('click', (e) => {
            // Fallback clipboard logic using input (iFrame friendly)
            const input = document.getElementById('clipboard-input');
            input.select();
            input.setSelectionRange(0, 99999); // For mobile devices
            try {
                document.execCommand('copy');
                showToast("Link Copied to Clipboard!");
            } catch (err) {
                showToast("Failed to copy");
            }
        });

        // Toast Helper
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        let toastTimeout;
        
        function showToast(msg) {
            toastMsg.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // --- 7. GLOBAL CLICK SPARKS & FLOATING FX ---
        function spawnFloatingElement(x, y, content, classes) {
            const el = document.createElement('div');
            el.className = `floating-element ${classes}`;
            el.innerHTML = content;
            el.style.left = `${x - 10}px`;
            el.style.top = `${y - 20}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function spawnSparks(x, y) {
            for(let i=0; i<6; i++) {
                const spark = document.createElement('div');
                spark.className = 'sparkle';
                spark.style.left = `${x}px`;
                spark.style.top = `${y}px`;
                
                // Random outward direction
                const angle = Math.random() * Math.PI * 2;
                const distance = 20 + Math.random() * 30;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                spark.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], { duration: 600, easing: 'ease-out' });

                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        // Add click sparks globally, except on the pet area so it doesn't overlap weirdly
        document.addEventListener('click', (e) => {
            if(e.target.closest('.interactive-cat')) return;
            spawnSparks(e.clientX, e.clientY);
        });

        // --- 8. CAT INTERACTION (Momo, Blacky, Mugi, Moli) ---
        const interactiveCats = document.querySelectorAll('.interactive-cat');
        const catIcons = ["🐾", "❤️", "✨", "🐟", "🐈"];

        interactiveCats.forEach(cat => {
            cat.addEventListener('click', (e) => {
                // Tampilkan Speech Bubble
                const bubble = cat.querySelector('.cat-bubble');
                if (bubble) {
                    bubble.style.opacity = '1';
                    setTimeout(() => bubble.style.opacity = '0', 1500);
                }

                // Animasi Melompat
                const avatar = cat.querySelector('.cat-avatar');
                if (avatar) {
                    avatar.style.transform = "translateY(-20px) scale(1.1)";
                    setTimeout(() => {
                        avatar.style.transform = "translateY(0) scale(1)";
                    }, 250);
                }

                // Efek Icon & Sparkle yang melayang
                const icon = catIcons[Math.floor(Math.random() * catIcons.length)];
                spawnFloatingElement(e.clientX, e.clientY, icon, 'text-xl drop-shadow-[0_0_5px_rgba(255,255,255,0.8)] z-50');
                spawnSparks(e.clientX, e.clientY);
            });
        });

    </script>
</body>
</html>
